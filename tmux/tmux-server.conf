# ── tmux-server.conf ────────────────────────────────────────────
# Server-friendly version of the local tmux config (~/.config/tmux/tmux.conf).
#
# ✅ What changed vs the local config:
#   • Paths switched to the ~/.tmux.conf layout (no ~/.config/tmux):
#       - reload bind          → ~/.tmux.conf
#       - TPM plugin dir       → ~/.tmux/plugins
#       - tpm run line         → ~/.tmux/plugins/tpm/tpm
#   • tmux-sessionizer bind only created if ~/scripts/tmux-sessionizer exists
#   • No macOS/local assumptions (no pbcopy, no brew, no ~/.config/tmux)
#
# 🛠 Requirements on the server:
#   • tmux 3.2+  (display-popup, popup-style)
#   • git       (TPM clones plugins on first start)
#   • internet  (to fetch plugins from GitHub; otherwise they simply warn)
#   • fzf       (only for the <prefix>C-e / <prefix>C-f fuzzy binds)
#
# 📦 Install:
#   cp tmux-server.conf ~/.tmux.conf
#   tmux
#   (TPM auto-installs the @plugin list on the first start)

# ── Base ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides "xterm-256color:RGB"
set -gq allow-passthrough on
set -g base-index 1
set -g pane-base-index 1
set -g mouse on
set -g escape-time 0
set -g allow-rename on
set -g set-titles on
set -g mode-keys vi
set -g status-position top

# ── Styling ───────────────────────────────────────────────────
ACCENT=colour7
set -g status-style "fg=colour249,bg=default"
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-left "#[fg=${ACCENT},bold] #S "
set -g status-right-length 60
set -g status-right "#[fg=colour249] %H:%M #[fg=${ACCENT},bold] #h "
set -g window-status-format "#[fg=colour243,bg=default] #I:#W "
set -g window-status-current-format "#[fg=${ACCENT},bg=default,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=${ACCENT}"
set -g message-style "fg=${ACCENT},bg=default,bold"
set -g popup-style "fg=colour249,bg=colour235"
setw -g mode-style "fg=colour235,bg=${ACCENT}"
setw -g clock-mode-colour ${ACCENT}
setw -g clock-mode-style 24

# ── Key bindings ──────────────────────────────────────────────
set-option -g prefix C-b
set-option -g prefix2 none

unbind r
bind r source-file ~/.tmux.conf; display-message 'config reloaded'

# Enable OSC 52 clipboard sequences
set -s set-clipboard on

unbind h
bind h copy-mode

bind Space last-window
bind b switch-client -l
bind-key -T prefix t set-option -g status

bind-key C-k run-shell "tmux set-option -g status-position top;"
bind-key C-j run-shell "tmux set-option -g status-position bottom;"

# Fuzzy-pick a session (<prefix>C-e) — requires fzf on the server
bind C-e display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session |\
    xargs tmux switch-client -t"

# Fuzzy-pick a window (<prefix>C-f) — requires fzf on the server
bind C-f display-popup -E "\
    tmux list-windows -F '#{window_index} #{window_name}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-window |\
    cut -d ' ' -f 1 |\
    xargs tmux select-window -t"

# Resize panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize pane
bind -r m resize-pane -Z

# Vim-style copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Instant switch to a session in ~/scripts (only if that script exists)
if-shell 'test -x ~/scripts/tmux-sessionizer' 'bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"'
bind-key n command-prompt "new-session -s '%%'"

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ── Plugins (TPM) ────────────────────────────────────────────
# Note: needs git + network to clone plugins on first start.
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'omerxx/tmux-sessionx' # <prefix>o
set -g @plugin "tmux-plugins/tmux-continuum" # auto-save/restore sessions
set -g @plugin "sainnhe/tmux-fzf" # fuzzy operations

set -g @sessionx-bind 'o'
set -g @sessionx-legacy-fzf-support 'on'
set -g @continuum-restore "on"

run '~/.tmux/plugins/tpm/tpm' # always keep this line last
