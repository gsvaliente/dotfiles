onboarding = false

[keys]
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

[ui.toast]
delivery = "off"

[theme]
name = "terminal"
auto_switch = false
 
[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "dots"

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [
    { token = "branch", dim = true },
    "git_status",
  ],
]

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr plugin action invoke open-sidebar --plugin herdr-sidebar"
description = "toggle herdr-sidebar"

