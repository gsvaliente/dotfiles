id = "herdr-last-local"
name = "herdr-last-local"
version = "0.1.0"
description = "Toggle to the previously focused tab and workspace."
min_herdr_version = "0.8.0"
platforms = ["macos", "linux", "windows"]

[[actions]]
id = "toggle-tab"
title = "Toggle last tab"
description = "Focus the previously active tab in the current workspace."
command = ["python3", "scripts/herdr-last.py", "toggle-tab"]

[[actions]]
id = "toggle-workspace"
title = "Toggle last workspace"
description = "Focus the previously active workspace."
command = ["python3", "scripts/herdr-last.py", "toggle-workspace"]

[[events]]
on = "tab.focused"
command = ["python3", "scripts/herdr-last.py", "remember-tab"]

[[events]]
on = "workspace.focused"
command = ["python3", "scripts/herdr-last.py", "remember-workspace"]
